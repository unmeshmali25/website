intro:
  - |
    Hi! I'm Unmesh. I'm a Senior Machine Learning Engineer at [CVS Health](https://www.cvshealth.com/), on the team behind CVS's personalized offer engines, which send 1B+ offers a week. I built the MLOps platform that cut model deployment from 4 weeks to 2 days, and I co-developed the ML models and optimization that decide which offers each customer gets.
  - |
    Before that, I built time-series forecasting and optimization for behind-the-meter battery storage at Sunverge and Rivian. At Sunverge, smarter charge and discharge scheduling for batteries saved utilities across the US hundreds of thousands of dollars. I started out verifying Green-e renewable energy and working on commercial solar. My interests include MLOps and ML platforms, recommender systems, and evaluating LLM applications.
  - |
    Right now I'm taking [AI Evals for Engineers and PMs](https://maven.com/parlance-labs/evals). Outside work, I built [a retail app with a 372-persona shopping simulation](https://github.com/unmeshmali25/voice-stt-powered-application), [a retail ML platform](https://github.com/unmeshmali25/deepmlhub), and [a LoRA fine-tune of Qwen2.5-1.5B](https://github.com/unmeshmali25/deepmlhub/tree/main/projects/llm-retard-lab).

