{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{- if and (not .Date.IsZero) .File (hasPrefix .File.Path "posts/") }}
  <p class="kicker"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time></p>
  {{- end }}
  {{ .Content }}
  {{- with .GetTerms "tags" }}
  <p class="tags">
    {{- range . }}<a href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a> {{ end }}
  </p>
  {{- end }}
</article>
{{ end }}
