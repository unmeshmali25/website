baseURL = 'https://unmeshm.com/'
languageCode = 'en-US'
title = 'Unmesh Mali'
theme = "hugo-bearblog"
enableRobotsTXT = true
# The Actions workflow checks out the committed public/ directory, then uploads
# ./public. Cleaning the destination keeps stale files in that checkout from
# being published. It does not delete public/ from git.
cleanDestinationDir = true

[pagination]
  pagerSize = 60

[params]
  author = "Unmesh Mali"
  # Fallback if a theme template reads params. Page copy comes from data/profile.yaml.
  description = "Unmesh Mali, Senior Machine Learning Engineer at CVS Health."
  mainSections = ["posts"]

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      typographer = false
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = "Writing"
    url = "/writing/"
    weight = 1
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/unmeshmali25"
    weight = 3

[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.llmsfull]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true
  [outputFormats.resume]
    mediaType = "application/json"
    baseName = "resume"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llms", "llmsfull", "resume"]
